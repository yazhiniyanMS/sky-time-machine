[project]
name = "sky-time-machine"
version = "0.1.0"
description = "Sky Time Machine backend: SPHEREx retrieval, image differencing and candidate analysis"
requires-python = ">=3.11"
dependencies = [
  "astropy>=7.0",
  "numpy>=2.0",
  "scipy>=1.13",
  "reproject>=0.14",
  "photutils>=2.0",
  "pyvo>=1.6",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0",
  "httpx>=0.27",
  "alembic>=1.13",
  "anthropic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]
postgres = ["psycopg[binary]>=3.2"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["stm*"]

[tool.ruff.lint.per-file-ignores]
"migrations/*" = ["E501"]
"stm/api/workspace.py" = ["E501"]  # embedded HTML report template

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not network'"
markers = [
  "network: test contacts the live IRSA archive (deselect with -m 'not network')",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
